build:
  gpu: true
  cuda: "12.1"
  python_version: "3.10"

  system_packages:
    - "git"
    - "ffmpeg"
    - "ca-certificates"
    - "libgl1"
    - "libglib2.0-0"

  python_packages:
    - "numpy"
    - "pillow"
    - "opencv-python-headless"
    - "safetensors"
    - "requests"
    - "pyyaml"
    - "aiohttp"
    - "tqdm"
    - "python-multipart"
    - "pydantic==1.10.15"
    - "fastapi==0.98.0"

  run:
    - pip uninstall -y torch torchvision torchaudio || true
    - pip install --no-cache-dir torch==2.3.1 torchvision==0.18.1 --index-url https://download.pytorch.org/whl/cu121

    # ComfyUI
    - rm -rf /src/ComfyUI
    - git clone https://github.com/comfyanonymous/ComfyUI /src/ComfyUI
    - pip install --no-cache-dir -r /src/ComfyUI/requirements.txt

    # 🔥 CRITICAL: custom nodes
    - git clone https://github.com/ltdrdata/ComfyUI-Manager /src/ComfyUI/custom_nodes/ComfyUI-Manager
    - git clone https://github.com/cubiq/ComfyUI_IPAdapter_plus /src/ComfyUI/custom_nodes/IPAdapter
    - git clone https://github.com/Fannovel16/comfyui_controlnet_aux /src/ComfyUI/custom_nodes/controlnet_aux
    - git clone https://github.com/Kosinkadink/ComfyUI-Advanced-ControlNet /src/ComfyUI/custom_nodes/advanced_controlnet

    # ⚠️ Senin workflow için kritik olan (deneme)
    - git clone https://github.com/BadCafeCode/ComfyUI_LayerStyle /src/ComfyUI/custom_nodes/LayerStyle

    - pip install --no-cache-dir "pydantic==1.10.15" "fastapi==0.98.0"

predict: "predict.py:Predictor"
