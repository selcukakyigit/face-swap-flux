build:
  gpu: true
  cuda: "12.1"
  python_version: "3.10"

  system_packages:
    - "git"
    - "ffmpeg"
    - "ca-certificates"
    - "libgl1"
    - "libglib2.0-0"

  python_packages:
    - "torch"
    - "torchvision"
    - "numpy"
    - "pillow"
    - "opencv-python-headless"
    - "safetensors"
    - "requests"
    - "pyyaml"
    - "aiohttp"
    - "tqdm"
    - "python-multipart"
    - "pydantic==1.10.15"

  run:
    - git clone --depth=1 https://github.com/comfyanonymous/ComfyUI /src/ComfyUI
    - pip install --no-cache-dir -r /src/ComfyUI/requirements.txt
    - pip install --no-cache-dir "pydantic==1.10.15"

predict: "predict.py:Predictor"
