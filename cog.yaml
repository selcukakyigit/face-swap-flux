build:
  gpu: true
  cuda: "12.1"
  python_version: "3.10"

  system_packages:
    - "git"
    - "wget"
    - "ffmpeg"
    - "ca-certificates"
    - "libgl1"
    - "libglib2.0-0"

  python_packages:
    - "numpy"
    - "pillow"
    - "opencv-python-headless"
    - "safetensors"
    - "requests"
    - "pyyaml"
    - "aiohttp"
    - "tqdm"
    - "python-multipart"
    - "pydantic==1.10.15"
    - "fastapi==0.98.0"
    - "huggingface_hub"

  run:
    - pip uninstall -y torch torchvision torchaudio || true
    - pip install --no-cache-dir torch==2.4.1 torchvision==0.19.1 --index-url https://download.pytorch.org/whl/cu121

    - rm -rf /src/ComfyUI
    - git clone https://github.com/comfyanonymous/ComfyUI /src/ComfyUI
    - pip install --no-cache-dir -r /src/ComfyUI/requirements.txt

    - mkdir -p /src/ComfyUI/custom_nodes
    - mkdir -p /src/ComfyUI/models/unet
    - mkdir -p /src/ComfyUI/models/vae
    - mkdir -p /src/ComfyUI/models/clip
    - mkdir -p /src/ComfyUI/models/loras

    - git clone --depth=1 https://github.com/scraed/LanPaint.git /src/ComfyUI/custom_nodes/LanPaint
    - git clone --depth=1 https://github.com/rgthree/rgthree-comfy.git /src/ComfyUI/custom_nodes/rgthree-comfy
    - git clone --depth=1 https://github.com/cubiq/ComfyUI_essentials.git /src/ComfyUI/custom_nodes/ComfyUI_essentials

    - pip install --no-cache-dir -e /src/ComfyUI/custom_nodes/LanPaint || true
    - pip install --no-cache-dir -r /src/ComfyUI/custom_nodes/rgthree-comfy/requirements.txt || true
    - pip install --no-cache-dir -r /src/ComfyUI/custom_nodes/ComfyUI_essentials/requirements.txt || true
    - pip install --no-cache-dir -r /src/ComfyUI/custom_nodes/LanPaint/requirements.txt || true

    - sed -i '/register_assets_routes/d' /src/ComfyUI/server.py
    - pip install --no-cache-dir "pydantic==1.10.15" "fastapi==0.98.0"

predict: "predict.py:Predictor"
