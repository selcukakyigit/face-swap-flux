name: Push model to Replicate

on:
  workflow_dispatch:

jobs:
  push-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          docker system prune -af || true
          docker buildx prune -af || true
          df -h

      - name: Install Cog
        uses: replicate/setup-cog@v2

      - name: Login to Replicate
        run: echo "${{ secrets.REPLICATE_API_TOKEN }}" | cog login --token-stdin

      - name: Push model (retry)
        env:
          HF_TOKEN: ${{ secrets.HUGGING_FACE_NEW }}
        run: |
          echo -n "$HF_TOKEN" > .hf_token
          for i in 1 2 3; do
            cog push r8.im/selcukakyigit/face-swap-flux && break
            echo "Retry $i failed, retrying..."
            sleep 10
          done
          rm -f .hf_token
