name: Push model to Replicate

on:
  workflow_dispatch:

jobs:
  push-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /usr/local/share/powershell || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /usr/lib/jvm || true
          sudo rm -rf /usr/local/share/chromium || true
          sudo rm -rf /usr/local/lib/node_modules || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /opt/hostedtoolcache || true
          sudo rm -rf /usr/local/graalvm || true
          sudo rm -rf /usr/local/.ghcup || true
          sudo apt-get clean || true
          docker system prune -af || true
          docker buildx prune -af || true
          df -h

      - name: Install Cog
        uses: replicate/setup-cog@v2

      - name: Login to Replicate
        run: echo "${{ secrets.REPLICATE_API_TOKEN }}" | cog login --token-stdin

      - name: Push model (retry)
        run: |
          for i in 1 2 3; do
            cog push r8.im/selcukakyigit/face-swap-flux && break
            echo "Retry $i failed, retrying..."
            sleep 10
          done
